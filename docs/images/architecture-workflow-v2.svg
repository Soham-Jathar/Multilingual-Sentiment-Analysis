<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title description">
  <title id="title">SentimentScope mandatory analysis and optional translation workflow</title>
  <desc id="description">A user review goes through mandatory preprocessing, language detection, and sentiment classification. Translation is the only optional branch.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8f2; }
      .title { fill: #102f27; font: 700 52px Arial, sans-serif; }
      .subtitle { fill: #527064; font: 26px Arial, sans-serif; }
      .box { fill: #ffffff; stroke: #bdd2c8; stroke-width: 3; }
      .required { fill: #e9f5e9; stroke: #64a85a; stroke-width: 4; }
      .optional { fill: #edf6fa; stroke: #5e9cbc; stroke-width: 4; }
      .result { fill: #123f35; }
      .box-title { fill: #102f27; font: 700 31px Arial, sans-serif; }
      .box-text { fill: #355d51; font: 24px Arial, sans-serif; }
      .tag-required { fill: #39803d; font: 700 20px Arial, sans-serif; letter-spacing: 2px; }
      .tag-optional { fill: #2f6d91; font: 700 20px Arial, sans-serif; letter-spacing: 2px; }
      .result-title { fill: #ffffff; font: 700 31px Arial, sans-serif; }
      .result-text { fill: #d7eee6; font: 24px Arial, sans-serif; }
      .connector { fill: none; stroke: #527064; stroke-width: 5; marker-end: url(#arrow); }
      .small { fill: #5e786d; font: 20px Arial, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#527064"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1080" rx="36"/>
  <text x="800" y="82" text-anchor="middle" class="title">SentimentScope workflow</text>
  <text x="800" y="122" text-anchor="middle" class="subtitle">Language detection and sentiment analysis are required. Translation is optional.</text>

  <rect x="540" y="165" width="520" height="110" rx="20" class="box"/>
  <text x="800" y="212" text-anchor="middle" class="box-title">User pastes a review</text>
  <text x="800" y="249" text-anchor="middle" class="box-text">English or supported Indian language</text>
  <path d="M800 275 L800 332" class="connector"/>

  <rect x="380" y="350" width="840" height="315" rx="26" class="required"/>
  <text x="430" y="402" class="tag-required">REQUIRED ANALYSIS</text>
  <line x1="430" y1="428" x2="1170" y2="428" stroke="#a9d4ac" stroke-width="2"/>
  <rect x="430" y="462" width="345" height="150" rx="18" class="box"/>
  <text x="602" y="516" text-anchor="middle" class="box-title">Language detection</text>
  <text x="602" y="554" text-anchor="middle" class="box-text">NLP preprocessing</text>
  <text x="602" y="587" text-anchor="middle" class="box-text">and script rules</text>
  <rect x="825" y="462" width="345" height="150" rx="18" class="box"/>
  <text x="997" y="516" text-anchor="middle" class="box-title">Sentiment classification</text>
  <text x="997" y="554" text-anchor="middle" class="box-text">Fine-tuned</text>
  <text x="997" y="587" text-anchor="middle" class="box-text">XLM-RoBERTa</text>
  <text x="800" y="646" text-anchor="middle" class="small">Both analyses run for every submitted review.</text>
  <path d="M800 665 L800 722" class="connector"/>

  <rect x="455" y="740" width="690" height="118" rx="20" class="result"/>
  <text x="800" y="786" text-anchor="middle" class="result-title">Display analysis result</text>
  <text x="800" y="826" text-anchor="middle" class="result-text">Sentiment + confidence + detected language</text>
  <path d="M800 858 L800 915" class="connector"/>

  <rect x="380" y="933" width="840" height="108" rx="24" class="optional"/>
  <text x="430" y="975" class="tag-optional">OPTIONAL — ONLY WHEN THE TRANSLATION TOGGLE IS ON</text>
  <text x="800" y="1017" text-anchor="middle" class="box-title">NLLB-200 translates the original review to the selected target language</text>
</svg>
