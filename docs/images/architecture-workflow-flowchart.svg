<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1500" viewBox="0 0 1080 1500" role="img" aria-labelledby="title description">
  <title id="title">SentimentScope workflow</title>
  <desc id="description">A symmetrical vertical workflow: user review, interface, API, preprocessing, required language detection and sentiment classification, optional translation decision, and final result.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#121414"/>
      <path d="M24 0H0V24" fill="none" stroke="#383b3b" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#e8ebe9"/>
    </marker>
    <style>
      .node { fill: #181a1a; stroke: #e8ebe9; stroke-width: 3; }
      .line { fill: none; stroke: #e8ebe9; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .arrow { fill: none; stroke: #e8ebe9; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow); }
      .heading { fill: #ffffff; font: 700 38px Arial, sans-serif; text-anchor: middle; letter-spacing: 1px; }
      .title { fill: #ffffff; font: 700 28px Arial, sans-serif; text-anchor: middle; }
      .title-small { fill: #ffffff; font: 700 23px Arial, sans-serif; text-anchor: middle; }
      .caption { fill: #c2c8c4; font: 18px Arial, sans-serif; text-anchor: middle; }
      .tag { fill: #a9e27b; font: 700 15px Arial, sans-serif; text-anchor: middle; letter-spacing: 2px; }
      .decision { fill: #ffffff; font: 700 21px Arial, sans-serif; text-anchor: middle; }
      .choice { fill: #a9e27b; font: 700 18px Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1080" height="1500" fill="url(#grid)"/>
  <text x="540" y="64" class="heading">SENTIMENTSCOPE WORKFLOW</text>
  <text x="540" y="98" class="caption">Required analysis with optional translation</text>

  <rect x="340" y="130" width="400" height="96" rx="18" class="node"/>
  <text x="540" y="174" class="title">User Review</text>
  <text x="540" y="204" class="caption">Text submitted by the user</text>
  <path d="M540 226V278" class="arrow"/>

  <rect x="340" y="288" width="400" height="96" rx="18" class="node"/>
  <text x="540" y="346" class="title">React + Vite UI</text>
  <path d="M540 384V436" class="arrow"/>

  <rect x="340" y="446" width="400" height="96" rx="18" class="node"/>
  <text x="540" y="504" class="title">FastAPI Backend</text>
  <path d="M540 542V594" class="arrow"/>

  <rect x="340" y="604" width="400" height="96" rx="18" class="node"/>
  <text x="540" y="646" class="title">NLP Preprocessing</text>
  <text x="540" y="677" class="caption">Clean and prepare the review text</text>

  <path d="M540 700V732H280V762" class="arrow"/>
  <path d="M540 732H800V762" class="arrow"/>

  <rect x="100" y="772" width="360" height="108" rx="18" class="node"/>
  <text x="280" y="810" class="tag">REQUIRED</text>
  <text x="280" y="846" class="title">Language Detection</text>
  <text x="280" y="869" class="caption">Detect input language</text>

  <rect x="620" y="772" width="360" height="108" rx="18" class="node"/>
  <text x="800" y="810" class="tag">REQUIRED</text>
  <text x="800" y="842" class="title-small">Fine-tuned XLM-RoBERTa</text>
  <text x="800" y="868" class="caption">Sentiment and confidence</text>

  <path d="M280 880V915H540" class="line"/>
  <path d="M800 880V915H540" class="line"/>
  <path d="M540 915V943" class="arrow"/>

  <polygon points="540,943 620,1023 540,1103 460,1023" class="node"/>
  <text x="540" y="1014" class="decision">Translation</text>
  <text x="540" y="1041" class="decision">toggle on?</text>

  <path d="M460 1023H280V1130" class="arrow"/>
  <text x="305" y="1068" class="choice">YES</text>
  <path d="M620 1023H800V1130" class="arrow"/>
  <text x="748" y="1068" class="choice">NO</text>

  <rect x="100" y="1140" width="360" height="105" rx="18" class="node"/>
  <text x="280" y="1178" class="tag">OPTIONAL</text>
  <text x="280" y="1214" class="title-small">NLLB-200 Translation</text>
  <text x="280" y="1236" class="caption">Translate to selected language</text>

  <rect x="620" y="1140" width="360" height="105" rx="18" class="node"/>
  <text x="800" y="1180" class="tag">NO TRANSLATION</text>
  <text x="800" y="1214" class="title-small">Use Original Review</text>
  <text x="800" y="1236" class="caption">Keep submitted text unchanged</text>

  <path d="M280 1245V1280H540" class="line"/>
  <path d="M800 1245V1280H540" class="line"/>
  <path d="M540 1280V1322" class="arrow"/>

  <rect x="290" y="1332" width="500" height="108" rx="18" class="node"/>
  <text x="540" y="1373" class="title">Final Analysis Result</text>
  <text x="540" y="1405" class="caption">Sentiment • confidence • detected language</text>
  <text x="540" y="1429" class="caption">Translation is included only when enabled</text>
</svg>
